[pytest]
pythonpath = backend
testpaths = backend/tests
markers =
    full_models: intégration complète QVD et modèles locaux réels (opt-in)
    local_ai: essais réels E5, OCR et Ollama sur corpus fictif local (opt-in)
    browser: parcours réel Chromium, Vite et FastAPI (sans modèles IA)
    models: essai réel du modèle d'embeddings local (opt-in)
